name: Release TPA Datapack

on:
  push:
    tags:
      - '*'   # 任何 tag 推送都会触发

jobs:
  release:
    name: Build & Release Datapack
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Set up the Python runtime used by the local build script.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install build dependencies
      run: python -m pip install -r scripts/requirements.txt

    # 3. Install zip (Ubuntu 默认已安装，但加上保证)
    - name: Install zip (if needed)
      run: |
        sudo apt-get update
        sudo apt-get install -y zip

    # 4. Build all variants and language packages.
    - name: Build all variants
      run: |
        python scripts/build.py

    - name: Package build artifacts
      run: |
        shopt -s nullglob
        for dir in build/TPA_Datapack-*; do
          [ -d "$dir" ] || continue
          name=$(basename "$dir")
          (
            cd "$dir" || exit
            zip -qr "../$name.zip" .
          )
        done

        echo "Generated files in build:"
        find build -maxdepth 1 -type f -printf '%f\n' | sort

    - name: Prepare release notes
      id: changelog
      run: |
        NOTES=$(cat CHANGELOG.md)
        echo "notes<<EOF" >> $GITHUB_ENV
        echo "$NOTES" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    # 6. Create GitHub Release with assets.
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: TPA Datapack ${{ github.ref_name }}
        body: ${{ env.notes }}
        files: build/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
